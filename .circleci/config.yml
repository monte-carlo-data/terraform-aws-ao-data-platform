version: 2.1

# PR validation gate for the public terraform-aws-ao-data-platform module.
# Validate-only: no AWS creds, no context, no secrets — so forked-PR builds are safe.
# Releasing is done by pushing a vX.Y.Z git tag (the Terraform Registry ingests via webhook),
# not by this pipeline.

jobs:
  run-sanity-check:
    docker:
      - image: hashicorp/terraform:1.13
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: apk add --update make
      - run:
          name: Format and validate
          command: make sanity-check

  run-test:
    docker:
      - image: hashicorp/terraform:1.13
    steps:
      - checkout
      - run:
          name: Install dependencies
          # bash and jq for hack/verify-no-plaintext.sh — the image is Alpine,
          # which ships neither.
          command: |
            apk add --update make
            apk add --no-cache bash jq
      - run:
          # Fast gate, ahead of the slow terraform test: exercises the
          # plaintext-in-state detector and its fixtures so they cannot rot.
          name: Plaintext detector self-test
          command: make selftest-verify-no-plaintext
      - run:
          # Same idea for the rotation checker: fixture mode needs no AWS
          # credentials and no cluster, so its version-diff logic can be gated
          # here rather than only exercised during a live rotation.
          name: Rotation checker self-test
          command: make selftest-rotation-check
      - run:
          name: Terraform test
          command: make test

workflows:
  validate:
    jobs:
      - run-sanity-check
      - run-test
